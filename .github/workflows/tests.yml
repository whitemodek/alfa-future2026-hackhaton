name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install
          openai==1.68.2 httpx==0.28.1 pydantic==2.10.6 psutil==6.1.1
          numpy==1.26.4 scipy==1.12.0 pandas==2.2.3 scikit-learn==1.5.2
          catboost==1.2.8 joblib==1.4.2 threadpoolctl==3.6.0
          lightgbm==4.6.0 xgboost==2.1.4
          pyarrow==19.0.1 matplotlib==3.9.4
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build solution
        run: python pack_solution.py dist/solution.zip
      - uses: actions/upload-artifact@v4
        with:
          name: solution
          path: dist/solution.zip
